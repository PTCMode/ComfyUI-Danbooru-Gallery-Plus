[project]
name = "comfyui-danbooru-gallery-plus"
version = "1.0.0"
description = "ComfyUI 单节点插件：在节点内浏览 Danbooru / Gelbooru，输出选中图片与提示词"
readme = "README.md"
authors = [{ name = "PTCMode" }]
license = { text = "MIT" }
dependencies = [
    "requests>=2.28.0",
    "urllib3>=1.26.0",
    "Pillow>=9.0.0",
    "numpy>=1.21.0",
]
requires-python = ">=3.9"
keywords = ["comfyui", "danbooru", "gelbooru", "gallery", "prompt", "custom-node"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["."]

[tool.setuptools.package-data]
"." = [
    "js/*.js",
    "js/global/*.js",
    "js/global/translations/*.js",
    "zh_cn/*.json",
    "zh_cn/*.csv",
]

[project.urls]
Homepage = "https://github.com/PTCMode/ComfyUI-Danbooru-Gallery-Plus"
Repository = "https://github.com/PTCMode/ComfyUI-Danbooru-Gallery-Plus"
Issues = "https://github.com/PTCMode/ComfyUI-Danbooru-Gallery-Plus/issues"
Upstream = "https://github.com/Aaalice233/ComfyUI-Danbooru-Gallery"
